<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=V, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span class="card_title">Web Designer</span>
<style>
    .card-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: linear-gradient(to bottom right, hwb(212 5% 89%), #4F67c2);
    box-shadow: 0.5px 2.5px 10px rgba(244, 243, 243, 0.3);
    max-width: 200px;
    margin: auto;
    text-align: center;
    font-family: arial, Arial, Helvetica, sans-serif;
    color: #fff;
    padding: 30px;
    border-radius: 20px;
}

.card2 {
    background: linear-gradient(to bottom right, #111b22, #4F67c2);
    box-shadow: 0.5px 2.5px 10px rgba(244, 243, 243, 0.3);
    max-width: 200px;
    margin: auto;
    text-align: center;
    font-family: arial, Arial, Helvetica, sans-serif;
    color: #fff;
    padding: 30px;
    border-radius: 20px;
}

.circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto;
    border: 5px solid #274f8a;
    border-bottom: 5px solid #161c24;
    box-shadow: 0.5px 9px 10px rgba(244, 243, 243, 0.3);
    position: relative;
}

.circle img {
    display: block;
    max-width: 100%;
    border-radius: 100%;
}

.card h2 {
    margin-top: 20px;
    font-size: 32px;
}

.card h3 {
    margin-top: 10px 0;
    font-size: 18px;
    color: #9cf3b7;
}

.card p {
    font-size: 14px;
    padding: 0 2px;
    font-weight: bold;
}

.social-links {
    padding: 16px 0;
}
</style>

<style>
    /* Container principal do Swiper */
.swiper {
    width: 100%;
    padding: 60px 0;
    background-color: #787a79;
}

.swiper-wrapper {
    display: flex;
    align-items: center;
}

/* IMPORTANTE: No Coverflow com slidesPerView "auto", o slide precisa de largura fixa */
.swiper-slide {
    width: 280px; /* Largura ideal para o card */
    height: 420px;
    display: flex;
    justify-content: center;
}

/* Estilo do Card */
.card2 {
    width: 100%;
    height: 100%;
    background-color: #fff;
    border-radius: 2em;
    box-shadow: 0 0 2em rgba(0, 0, 0, 0.2);
    padding: 2em 1.5em;
    display: flex;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

/* Efeito de desfoque nos slides laterais */
.swiper-slide:not(.swiper-slide-active) {
    filter: blur(2px);
    opacity: 0.7;
}

/* Centralização perfeita da imagem de perfil */
.card-image2 {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid #9176ff;
    padding: 3px;
    margin: 0 auto 1.5em auto; /* 'auto' nas laterais garante o centro perfeito */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.card-image2 img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.card_content {
    display: flex;
    align-items: center;
    flex-direction: column;
    width: 100%;
}

.card_title {
    font-size: 1.3em;
    font-weight: 500;
}

.card_name {
    color: #9176ff;
    font-weight: 600;
    margin-top: 5px;
    font-size: 1.1em;
}

.card_text {
    text-align: center;
    font-size: 0.95em;
    margin: 1em 0;
    color: #555;
}

.card_btn {
    background-color: #9176ff;
    color: #fff;
    font-size: 0.9rem;
    text-transform: uppercase;
    font-weight: 600;
    border: none;
    padding: 0.6em 1.2em;
    border-radius: 0.5em;
    cursor: pointer;
    transition: background 0.3s;
}

.card_btn:hover {
    background-color: #7b5ee6;
}
</style>

</body>
</html>
